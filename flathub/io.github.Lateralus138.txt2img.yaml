app-id: io.github.Lateralus138.txt2img
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: txt2img
separate-locales: false
finish-args:
  - --device=all
  - --filesystem=host
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland

modules:
  - name: txt2img
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/Lateralus138/txt2img.git
        tag: v1.0.0
        commit: 369ab2aa106ca3cbdf767c187e1dc5c7bf4bb28f
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_STATIC=OFF
