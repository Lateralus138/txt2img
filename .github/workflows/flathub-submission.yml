name: Flathub Submission

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.0.0)'
        required: true
      commit:
        description: 'Commit hash to release'
        required: true

jobs:
  flathub:
    name: Prepare and Test Flathub Submission
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
    - uses: actions/checkout@v6
    
    - name: Prepare Manifest and Metainfo
      run: |
        VERSION="${{ github.event.inputs.version }}"
        # Ensure version starts with 'v'
        if [[ ! $VERSION =~ ^v ]]; then
          VERSION="v$VERSION"
        fi
        
        # Update manifest (preserving indentation)
        sed -i "s/\(tag: \).*/\1$VERSION/" flathub/io.github.Lateralus138.txt2img.yaml
        sed -i "s/\(commit: \).*/\1${{ github.event.inputs.commit }}/" flathub/io.github.Lateralus138.txt2img.yaml
        
        # Update metainfo releases
        CURRENT_DATE=$(date +%Y-%m-%d)
        # Remove old releases and add new one
        sed -i '/<releases>/,/<\/releases>/c\  <releases>\n    <release version="'"$VERSION"'" date="'"$CURRENT_DATE"'" />\n  </releases>' docs/media/io.github.Lateralus138.txt2img.metainfo.xml
        
        echo "Updated Manifest:"
        cat flathub/io.github.Lateralus138.txt2img.yaml
        echo "Updated Metainfo:"
        cat docs/media/io.github.Lateralus138.txt2img.metainfo.xml

    - name: Validate AppStream
      run: |
        appstream-util validate docs/media/io.github.Lateralus138.txt2img.metainfo.xml

    - name: Build and Test Flatpak
      run: |
        flatpak-builder --user --repo=repo --force-clean build-dir flathub/io.github.Lateralus138.txt2img.yaml
        flatpak build-bundle repo txt2img-test.flatpak io.github.Lateralus138.txt2img

    - name: Upload Test Bundle
      uses: actions/upload-artifact@v7
      with:
        name: txt2img-flathub-test
        path: txt2img-test.flatpak

    - name: Instructions for Submission
      run: |
        echo "Flathub submission prepared and tested."
        echo "To submit to Flathub:"
        echo "1. Clone your Flathub repository: git clone https://github.com/flathub/io.github.Lateralus138.txt2img"
        echo "2. Copy the manifest from flathub/io.github.Lateralus138.txt2img.yaml to the Flathub repo."
        echo "3. Commit and push to the Flathub repo."
